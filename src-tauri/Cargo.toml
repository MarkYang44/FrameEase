[package]
name = "frameease"
description = "FrameEase — local video compression & transcoding toolbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "frameease_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
fe-core = { path = "../crates/fe-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.11.6", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.5"
tiny_http = { version = "0.12.0", optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.20"

[features]
# Debug-only HTTP bridge so the UI can be driven against the real backend from a
# browser for automated UI checks. Never enable for release builds.
dev-bridge = ["dep:tiny_http"]
