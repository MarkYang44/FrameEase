name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15 # Apple Silicon
          - os: windows-latest
    # No Intel Mac job: Homebrew no longer publishes x86_64 macOS bottles of FFmpeg, so
    # an Intel runner has no FFmpeg to bundle (see docs/TESTING.md).
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Steps run through scripts/ci-step.sh repeat their error output as annotations,
      # so a failure is readable on the run page without opening the logs.

      # macOS: Homebrew's FFmpeg 8 (the version the app is verified with), made
      # relocatable. Its minimum macOS is the runner's OS version, so the app's minimum
      # is set from the bundled binaries.
      - name: FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          bash scripts/ci-step.sh "brew install" brew install ffmpeg@8
          bash scripts/ci-step.sh "Bundle FFmpeg" python3 scripts/bundle_ffmpeg_macos.py "$(brew --prefix ffmpeg@8)/bin"
          MINOS=$(otool -l src-tauri/resources/ffmpeg/ffmpeg | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
          python3 -c "import json,sys; p='src-tauri/tauri.bundle.json'; d=json.load(open(p)); d['bundle']['macOS']['minimumSystemVersion']=sys.argv[1]; json.dump(d,open(p,'w'),indent=2)" "$MINOS"
          echo "::notice title=Bundled FFmpeg::requires macOS $MINOS"

      # Windows: BtbN's shared GPL build of FFmpeg 8.1. x264/x265/SVT-AV1/libaom/dav1d/libass…
      # are linked into FFmpeg's own DLLs, which ship beside ffmpeg.exe and ffprobe.exe, so the
      # codec set is bundled once instead of once per program as in the static build.
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/ci-step.sh "FFmpeg" pwsh -NoProfile -File scripts/fetch-ffmpeg-windows.ps1

      - run: npm ci

      - name: Generate synthetic test media
        shell: bash
        run: bash scripts/ci-step.sh "Test media" bash scripts/gen-test-media.sh test-media src-tauri/resources/ffmpeg

      # Unit + end-to-end tests against the real backend (includes the locked-CSV regression).
      # --no-fail-fast: report every failing test binary, not just the first.
      - name: Core tests
        shell: bash
        run: bash scripts/ci-step.sh "Core tests" cargo test -p fe-core --no-fail-fast -- --test-threads=2

      - name: Frontend type check
        shell: bash
        run: bash scripts/ci-step.sh "Type check" npm run typecheck

      - name: Frontend regression tests
        shell: bash
        run: bash scripts/ci-step.sh "Frontend tests" npm test

      - name: Browser regression tests
        shell: bash
        run: |
          bash scripts/ci-step.sh "Install Chromium" npx playwright install chromium
          bash scripts/ci-step.sh "Browser tests" npm run test:ui

      - name: Package
        shell: bash
        env:
          STATIC_VCRUNTIME: "true"
        run: bash scripts/ci-step.sh "Package" npx tauri build --config src-tauri/tauri.bundle.json

      - name: Windows no-install ZIP
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/ci-step.sh "Portable ZIP" pwsh -NoProfile -File scripts/build-windows-portable.ps1 -SmokeTest

      # Windows: both installers must carry every bundled FFmpeg file (the DLLs included), and
      # ffmpeg.exe/ffprobe.exe must start from the unpacked folder with nothing else on PATH.
      - name: Check installers (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/ci-step.sh "Check installers" pwsh -NoProfile -File scripts/check-windows-installers.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: frameease-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/portable/*.zip
          if-no-files-found: error

  # Pushing a version tag (v1.2.3, matching the version in tauri.conf.json) publishes that
  # commit's installers as a GitHub release, with SHA-256 checksums and
  # docs/releases/<tag>.md as the release notes.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          [ "$TAG" = "v$version" ] || { echo "::error title=Release::tag $TAG does not match app version $version"; exit 1; }
          mkdir release
          find artifacts -type f \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.msi' -o -name '*-portable.zip' \) -exec cp {} release/ \;
          cd release
          sha256sum -- *.dmg *-setup.exe *.msi *-portable.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "FrameEase $version" --notes-file "../docs/releases/$TAG.md" \
            *.dmg *-setup.exe *.msi *-portable.zip SHA256SUMS.txt
