name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
          - os: macos-13 # Intel
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # macOS: Homebrew FFmpeg made relocatable. Its minimum macOS is the runner's
      # OS version, so the app's minimum is set from the bundled binaries.
      - name: FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          python3 scripts/bundle_ffmpeg_macos.py
          MINOS=$(otool -l src-tauri/resources/ffmpeg/ffmpeg | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
          python3 -c "import json,sys; p='src-tauri/tauri.bundle.json'; d=json.load(open(p)); d['bundle']['macOS']['minimumSystemVersion']=sys.argv[1]; json.dump(d,open(p,'w'),indent=2)" "$MINOS"
          echo "Bundled FFmpeg requires macOS $MINOS"

      # Windows: static GPL build (x264/x265/SVT-AV1/libaom/dav1d/libass…), no DLLs to manage.
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-ffmpeg-windows.ps1

      - run: npm ci

      - name: Generate synthetic test media
        shell: bash
        run: bash scripts/gen-test-media.sh test-media src-tauri/resources/ffmpeg

      # Unit + end-to-end tests against the real backend (includes the locked-CSV regression).
      - name: Core tests
        run: cargo test -p fe-core -- --test-threads=2

      - name: Frontend type check
        run: npm run typecheck

      - name: Package
        run: npx tauri build --config src-tauri/tauri.bundle.json

      - uses: actions/upload-artifact@v4
        with:
          name: frameease-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
